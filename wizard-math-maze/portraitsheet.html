<!doctype html><html><head><meta charset="utf-8"><title>portrait</title>
<style>body{margin:0;background:#0b0a22;color:#c8a4ff;font:11px system-ui;padding:10px}
h3{margin:12px 0 4px;font-size:12px;color:#f9ca74;letter-spacing:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.c{text-align:center}
canvas{display:block;border:1px solid #2a2a55;background:#141232;border-radius:10px}</style></head>
<body><div id="out"></div>
<script type="module">
import { drawPortrait } from '/src/engine/portrait.js'
import { drawWizard } from '/src/engine/wizardSprite.js'
import { WIZARDS } from '/src/game/wizards.js'
import { formById } from '/src/game/skins.js'
import { HAIR_COLORS, blankAppearance } from '/src/game/appearance.js'
const out=document.getElementById('out')
function row(title){const h=document.createElement('h3');h.textContent=title;out.append(h)
  const r=document.createElement('div');r.className='row';out.append(r);return r}
function port(r,size,form,wiz,hair,label){
  const d=document.createElement('div');d.className='c'
  const cv=document.createElement('canvas');cv.width=size*2;cv.height=size*2
  cv.style.width=size+'px';cv.style.height=size+'px';d.append(cv)
  const ctx=cv.getContext('2d')
  drawPortrait(ctx,{cx:size,cy:size*0.86,R:size*0.44,wiz,hair,form,t:1200})
  if(label){const t=document.createElement('div');t.textContent=label;d.append(t)}
  r.append(d)
}
function sprite(r,size,form,label){
  const d=document.createElement('div');d.className='c'
  const cv=document.createElement('canvas');cv.width=size*2;cv.height=size*2
  cv.style.width=size+'px';cv.style.height=size+'px';d.append(cv)
  drawWizard(cv.getContext('2d'),{x:size,yBase:size*2*0.94,h:size*2*0.82,form,
    appearance:{...blankAppearance(),hairColor:2},t:1200,moving:false,view:'front'})
  if(label){const t=document.createElement('div');t.textContent=label;d.append(t)}
  r.append(d)
}
const DEF=['#b0541f','#2b2732']
let r=row('The set so far — do they read as different people?')
sprite(r,240,formById('apprentice'),'now')
WIZARDS.forEach((w,i)=>port(r,240,formById('apprentice'),w,DEF[i],w.name))
r=row('Kestrel across hair colours')
for(const h of HAIR_COLORS) port(r,170,formById('apprentice'),WIZARDS[1],h.hex,h.name)
r=row('Kestrel in robes and hats')
for(const id of ['frost','ember','storm','leaf','candle'])
  port(r,170,formById(id),WIZARDS[1],'#2b2732',id)
r=row('Small (110 / 76)')
WIZARDS.forEach((w,i)=>{port(r,110,formById('apprentice'),w,DEF[i]);port(r,76,formById('apprentice'),w,DEF[i])})
window.__done=true
</script></body></html>
